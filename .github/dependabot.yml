version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 10
    reviewers:
      - "Surya-Hariharan"
    allow:
      - dependency-type: "all"
    # Batch low-risk bumps into single PRs to cut review noise; majors stay
    # individual so breaking changes get scrutinized one at a time.
    groups:
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "python"
      - dependency-name: "pip"
      # mcp 2.0.0 rewrote the low-level Server API (decorator-based
      # @server.list_tools()/@server.call_tool() registration
      # velune/mcp/server.py depends on was removed in favor of constructor
      # kwargs) — see the mcp constraint comment in pyproject.toml. That
      # migration is deliberately deferred, so stop proposing the major
      # bump every cycle (PR #17); minor/patch bumps within <2.0.0 are
      # still welcome.
      # `update-types` alone did not stop PR #21, which *widened* the allowed
      # range to <3.0.0 instead of proposing a major update. Verified: with
      # mcp 2.3.0 `Server.list_tools`/`call_tool` no longer exist and the
      # server integration tests fail. Ignore the versions explicitly.
      - dependency-name: "mcp"
        versions: [">=2.0.0"]
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 5
    reviewers:
      - "Surya-Hariharan"
    groups:
      actions:
        update-types:
          - "minor"
          - "patch"
