version: 2
updates:
  # "uv" (not "pip"): it updates uv.lock together with pyproject.toml. With "pip" the
  # lockfile was left stale and CI's `uv lock --check` failed every dependency PR.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    # Version updates are paused: 0 opens no routine bump PRs. Security update PRs are
    # unaffected. Restore to 10 to resume.
    open-pull-requests-limit: 0
    # Wait a week before proposing a freshly published release, so a compromised or yanked
    # version is usually withdrawn before it reaches a PR. Security updates are not delayed.
    cooldown:
      default-days: 7
    reviewers:
      - "Surya-Hariharan"
    allow:
      - dependency-type: "all"
    # Batch low-risk bumps into single PRs to cut review noise; majors stay
    # individual so breaking changes get scrutinized one at a time.
    groups:
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "python"
      - dependency-name: "pip"
      # mcp 2.0.0 rewrote the low-level Server API (decorator-based
      # @server.list_tools()/@server.call_tool() registration
      # velune/mcp/server.py depends on was removed in favor of constructor
      # kwargs) — see the mcp constraint comment in pyproject.toml. That
      # migration is deliberately deferred, so stop proposing the major
      # bump every cycle (PR #17); minor/patch bumps within <2.0.0 are
      # still welcome.
      # `update-types` alone did not stop PR #21, which *widened* the allowed
      # range to <3.0.0 instead of proposing a major update. Verified: with
      # mcp 2.3.0 `Server.list_tools`/`call_tool` no longer exist and the
      # server integration tests fail. Ignore the versions explicitly.
      - dependency-name: "mcp"
        versions: [">=2.0.0"]
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    # Paused, as above. Restore to 5 to resume.
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
    reviewers:
      - "Surya-Hariharan"
    groups:
      actions:
        update-types:
          - "minor"
          - "patch"
