name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

# Node.js 24 became the default on 2026-06-16. Force it explicitly so the
# pinned @v4/@v5 action tags use Node 24 runtimes consistently.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  ci:
    name: Run CI Pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # setuptools <83.0.0: PYSEC-2026-3447. actions/setup-python bundles
          # its own setuptools with the interpreter, independent of anything
          # velune pins, so it must be upgraded explicitly in this job.
          pip install --upgrade "setuptools>=83.0.0"
          pip install -e ".[all,dev]" ruff pyright pip-audit build wheel

      - name: Ruff lint
        run: ruff check velune/

      - name: Ruff format
        run: ruff format --check velune/

      - name: Pyright
        run: pyright velune/

      - name: Tests
        run: pytest

      - name: Security checks
        run: |
          # --skip-editable: velune-cli itself is installed editable (-e .)
          # and unpublished, so PyPI has no record to audit it against; that
          # skip is expected and doesn't affect coverage of its dependencies.
          pip-audit --skip-editable
          if grep -rn "shell=True" velune/ 2>/dev/null; then
            echo "❌ FATAL: shell=True found in codebase"
            exit 1
          fi
          count=$(grep -rn "asyncio\.run(" velune/ --exclude="runner.py" | wc -l)
          if [ "$count" -gt 1 ]; then
            echo "❌ FATAL: Found $count asyncio.run() calls outside allowlist"
            exit 1
          fi


  # The job above is a quick single-platform check. This runs the repository's
  # complete CI pipeline (Windows/macOS/Linux x Python 3.10-3.14, wheel and
  # installer smoke tests) so a tag cannot publish while that matrix is red.
  full-ci:
    name: Full CI Matrix
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build Package
    needs: [ci, full-ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG="$(python -c 'import velune; print(velune.__version__)')"
          if [ "$TAG" != "$PKG" ]; then
            echo "❌ Tag v$TAG does not match velune.__version__ ($PKG)"
            exit 1
          fi
          echo "✓ Tag matches package version: $PKG"

      - name: Build package (reproducible)
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          python -m build

      - name: Validate metadata (twine check --strict)
        run: twine check --strict dist/*

      - name: Verify artifacts are complete and match the tag
        run: |
          # Exactly one non-empty wheel and sdist, both opening cleanly, with
          # the tagged version in their metadata.
          python scripts/release_artifacts.py verify \
            --dist dist --version "${GITHUB_REF#refs/tags/v}"

      - name: Generate SHA-256 checksums
        run: |
          # Written outside dist/ so the PyPI upload never sees it.
          python scripts/release_artifacts.py checksums \
            --dist dist --output checksums/SHA256SUMS

      # Artifact names are scoped to the whole workflow run, and the full-ci job
      # (ci.yml, run inside this same run) already uploads one named "dist".
      # Release artifacts therefore carry a "release-" prefix; reusing "dist"
      # would make this upload fail with a name conflict.
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: release-checksums
          path: checksums/SHA256SUMS
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/velune-cli
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: release-checksums
          path: checksums/

      - name: Verify artifacts are unchanged since the build job
        run: |
          # Integrity check only (corruption or truncation in transit between
          # jobs); it does not prove who built the files.
          (cd dist && sha256sum --check --strict ../checksums/SHA256SUMS)
          test "$(ls dist | wc -l)" -eq "$(wc -l < checksums/SHA256SUMS)"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # Uses the PYPI_TOKEN repo secret for API token auth.
          password: ${{ secrets.PYPI_TOKEN }}
          skip-existing: true

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/

      - name: Download checksums
        uses: actions/download-artifact@v4
        with:
          name: release-checksums
          path: checksums/

      - name: Verify artifacts match the checksum manifest
        run: python3 scripts/release_artifacts.py check --dist dist --sums checksums/SHA256SUMS

      - name: Get version from tag
        id: get_version
        run: |
          echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "clean_version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Extract changelog
        id: changelog
        run: |
          CLEAN_VERSION="${{ steps.get_version.outputs.clean_version }}"
          python3 - "$CLEAN_VERSION" > /tmp/changelog_body.txt << 'PYEOF'
          import os, re, sys
          from pathlib import Path

          version = sys.argv[1]
          changelog = Path("CHANGELOG.md")
          if not changelog.exists():
              print(f"## Velune CLI v{version}\n\nSee the [full changelog](https://github.com/Surya-Hariharan/Velune-CLI/blob/main/CHANGELOG.md) for details.")
              sys.exit(0)
          text = changelog.read_text(encoding="utf-8")

          # Match the section for this specific version, stopping at the next ## heading.
          pattern = rf"## \[{re.escape(version)}\][^\n]*\n(.*?)(?=\n## \[|\Z)"
          match = re.search(pattern, text, re.DOTALL)
          if match:
              body = match.group(1).strip()
              # Prepend a header so the GitHub release body is self-contained.
              header = (
                  f"## Velune CLI v{version}\n\n"
                  f"> **[Full changelog](https://github.com/Surya-Hariharan/Velune-CLI/blob/main/CHANGELOG.md)** | "
                  f"**[PyPI](https://pypi.org/project/velune-cli/{version}/)** | "
                  f"**[Documentation](https://github.com/Surya-Hariharan/Velune-CLI/tree/main/docs)**\n\n"
                  f"Source: [`v{version}`](https://github.com/Surya-Hariharan/Velune-CLI/tree/v{version}) "
                  f"(commit `{os.environ.get('GITHUB_SHA', 'unknown')[:7]}`) · canonical repository "
                  f"[Surya-Hariharan/Velune-CLI](https://github.com/Surya-Hariharan/Velune-CLI)\n\n"
              )
              print(header + body)
          else:
              print(
                  f"## Velune CLI v{version}\n\n"
                  f"See the [full changelog](https://github.com/Surya-Hariharan/Velune-CLI/blob/main/CHANGELOG.md) for details."
              )
          PYEOF
          {
            echo "body<<CHANGELOG_EOF"
            cat /tmp/changelog_body.txt
            printf '\n\n---\n\n**Verifying downloads.** `SHA256SUMS` lists the SHA-256 of each file attached to this release; run `sha256sum --check SHA256SUMS` in the folder holding them. This detects corrupted or mismatched downloads. It is not a signature and does not prove who published the files.\n'
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Velune CLI ${{ steps.get_version.outputs.clean_version }}"
          tag_name: ${{ steps.get_version.outputs.version }}
          files: |
            dist/*
            checksums/SHA256SUMS
          fail_on_unmatched_files: true
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: ${{ contains(steps.get_version.outputs.version, 'alpha') || contains(steps.get_version.outputs.version, 'beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
