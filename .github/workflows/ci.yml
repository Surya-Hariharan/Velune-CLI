name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Node.js 24 became the default on 2026-06-16. Force it explicitly so the
# pinned @v4/@v5 action tags use Node 24 runtimes consistently.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# Least-privilege default token: CI only needs to read the checkout. Any job
# that requires more must opt in explicitly with its own permissions block.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pyright

      - name: Ruff lint check
        run: ruff check velune/

      - name: Ruff format check
        run: ruff format --check velune/

      - name: Pyright type checking
        run: pyright velune/

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # gitleaks needs full history to resolve push commit ranges

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # setuptools <83.0.0: PYSEC-2026-3447. actions/setup-python bundles
          # its own setuptools with the interpreter, independent of anything
          # velune pins, so it must be upgraded explicitly in this job.
          pip install --upgrade "setuptools>=83.0.0"
          pip install pip-audit "bandit[toml]"
          # Install the package so pip-audit sees velune's real runtime
          # dependency closure, not just pip-audit's own deps.
          pip install -e .

      - name: Check for pip vulnerabilities
        run: |
          # --skip-editable: velune-cli itself is installed editable (-e .)
          # and unpublished, so PyPI has no record to audit it against; that
          # skip is expected and doesn't affect coverage of its dependencies,
          # which are installed normally and audited as usual.
          pip-audit --skip-editable

      - name: Verify lockfile reproducibility
        # `uv.lock` pins the exact resolved dependency graph (versions +
        # hashes) so a dev machine, CI, and a release build all resolve
        # identically instead of drifting apart on "whatever's newest today".
        # `uv lock --check` fails instead of silently re-resolving if
        # pyproject.toml's declared dependencies and uv.lock have gone out of
        # sync — e.g. a dependency bump that forgot to regenerate the lock.
        run: |
          pip install -q uv
          uv lock --check

      - name: Bandit static security scan
        # Gate on medium+ severity & confidence; full low-severity report is
        # printed for visibility but does not fail the build.
        run: |
          bandit -c pyproject.toml -r velune/ || true
          bandit -c pyproject.toml -r velune/ --severity-level medium --confidence-level medium

      - name: Bandit low-severity regression baseline
        # Low-severity findings (183 as of writing — mostly broad
        # try/except-pass patterns, not a mass rewrite worth blocking every
        # PR on) aren't part of the gate above, so nothing stops that count
        # from silently growing over time. This doesn't re-triage the
        # existing 183; it only fails if new ones are added. Raise
        # BASELINE_LOW deliberately, in the PR that adds the finding, only
        # after confirming it's reviewed and accepted — the same convention
        # already used for the asyncio.run() and create_subprocess_shell
        # allowlists above.
        run: |
          BASELINE_LOW=183
          bandit -c pyproject.toml -r velune/ -f json -o bandit_low.json --quiet || true
          count=$(python -c "import json; print(json.load(open('bandit_low.json'))['metrics']['_totals']['SEVERITY.LOW'])")
          rm -f bandit_low.json
          echo "Low-severity bandit findings: $count (baseline: $BASELINE_LOW)"
          if [ "$count" -gt "$BASELINE_LOW" ]; then
            echo "❌ FATAL: low-severity bandit findings grew from $BASELINE_LOW to $count."
            echo "Review the new finding(s); raise BASELINE_LOW in this file only once accepted."
            exit 1
          fi
          echo "✓ No low-severity regression"
          exit 0

      - name: Secret scan (gitleaks)
        # Run the gitleaks CLI directly rather than gitleaks/gitleaks-action:
        # the action calls the GitHub API to classify the account as an org
        # vs. individual, and when that call is rate-limited it fails closed
        # by demanding a paid license, even for personal/public repos.
        env:
          # Scan only the commits this push/PR actually introduces, not the
          # full repository history. Historical commits were already scanned
          # when they landed; re-scanning them on every subsequent run finds
          # nothing new and forces a permanently-growing allowlist for
          # synthetic test fixtures that were already confirmed safe.
          SCAN_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          SCAN_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.after }}
        run: |
          GITLEAKS_VERSION="8.30.1"
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          if [ -n "$SCAN_BASE" ] && [ "$SCAN_BASE" != "0000000000000000000000000000000000000000" ]; then
            ./gitleaks detect --source . --redact -v --log-opts="${SCAN_BASE}..${SCAN_HEAD}"
          else
            # New branch / no comparable base (e.g. first push) — scan just
            # the tip commit via git rather than the entire history.
            ./gitleaks detect --source . --redact -v --log-opts="-1"
          fi
          rm -f gitleaks gitleaks.tar.gz

      - name: Check for shell=True usage (P0-2 regression)
        run: |
          if grep -rn "shell=True" velune/ 2>/dev/null; then
            echo "❌ FATAL: shell=True found in codebase (P0-2 regression)"
            exit 1
          fi
          echo "✓ No shell=True found"
          exit 0

      - name: Check for un-allowlisted create_subprocess_shell usage (P0-2b regression)
        run: |
          # asyncio.create_subprocess_shell() is functionally shell=True and was
          # invisible to the literal "shell=True" grep above. Every call site must
          # be a reviewed, trust-gated, user-configured-command path — currently
          # hooks/executor.py (session hooks, gated on workspace trust) and
          # cli/commands/file_commands.py (TOML custom slash commands). Any other
          # call site is a new, unreviewed shell-injection surface.
          hits=$(grep -rln "create_subprocess_shell" velune/ \
            --exclude="executor.py" --exclude="file_commands.py" 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "❌ FATAL: create_subprocess_shell found outside the reviewed allowlist (P0-2b regression)"
            echo "$hits"
            exit 1
          fi
          echo "✓ create_subprocess_shell usage matches the reviewed allowlist"
          exit 0

      - name: Check asyncio.run() count (P0-1 regression)
        run: |
          count=$(grep -rn "asyncio\.run(" velune/ | wc -l)
          if [ "$count" -gt 1 ]; then
            echo "❌ FATAL: Found $count asyncio.run() calls outside allowlist (P0-1 regression)"
            grep -rn "asyncio\.run(" velune/
            exit 1
          fi
          echo "✓ asyncio.run() count is acceptable ($count)"
          exit 0

  test:
    name: Tests (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package with all extras + test tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"

      - name: Run test suite
        run: pytest

  build:
    name: Build & Validate Artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so SOURCE_DATE_EPOCH can be derived from the commit.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist + wheel (reproducible)
        run: |
          # Pin archive timestamps to the commit date so builds are
          # byte-for-byte reproducible (Hatchling honors SOURCE_DATE_EPOCH).
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
          python -m build

      - name: Validate metadata (twine check --strict)
        run: twine check --strict dist/*

      - name: Verify wheel is pure-python (no platform tag)
        run: |
          if ls dist/*.whl | grep -qv 'py3-none-any'; then
            echo "❌ Expected a single pure-python (py3-none-any) wheel"
            ls -lh dist/
            exit 1
          fi
          echo "✓ Pure-python wheel: $(ls dist/*.whl)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  install-smoke:
    name: Wheel Install + REPL Smoke (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download built wheel
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install the built wheel into a clean environment
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # Install the wheel (not the source tree) to verify the published
          # artifact and its dependency closure resolve on every OS.
          python -m pip install dist/*.whl

      - name: REPL smoke test (entrypoint resolves, no import-time crash)
        shell: bash
        run: |
          velune --version
          velune --help
          # The console-script and module form must agree.
          python -m velune --version
          # Subcommand help builds each command's Typer/Click signature — this
          # is where a dependency API mismatch (e.g. old typer + new click)
          # crashes, so it must succeed strictly (no `|| true`).
          for cmd in doctor config provider models; do velune "$cmd" --help > /dev/null; done
          # Environment diagnostics must run without import-time crashes on
          # every supported interpreter (exit code ignored — warnings are fine).
          velune doctor check || true

  # The declared dependency floors are a promise: anyone whose environment
  # already holds exactly those versions keeps them (pip treats the floor as
  # satisfied). Install the *lowest* allowed version of every direct
  # dependency, wheel-only, and run the suite — so a floor that is too old
  # (API break at runtime) or has no wheel for some Python/OS (→ "Microsoft
  # Visual C++ 14.0 is required" source build on a user's machine) fails here.
  install-lowest:
    name: Lowest Dependency Versions (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.14"]
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download built wheel
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install lowest direct dependencies (wheels only) + the wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip uv
          # --no-build: a floor without a wheel for this Python/OS is a bug.
          uv pip install --system --no-build --resolution lowest-direct -r pyproject.toml
          uv pip install --system --no-deps dist/*.whl
          # Test tooling at current versions (not part of the floor check).
          uv pip install --system "pytest>=8.0.0" "pytest-asyncio>=0.23.0"
          uv pip list --system

      - name: Smoke test
        shell: bash
        run: |
          velune --version
          velune --help
          for cmd in doctor config provider models; do velune "$cmd" --help > /dev/null; done
          velune doctor check || true

      - name: Test suite at lowest versions
        run: pytest -m "not integration"

  # Reproduces the most common real-world failure: `pip install velune-cli`
  # into a Python that already holds stale copies of our dependencies from
  # some other tool. pip must upgrade them to our floors and Velune must start.
  install-polluted:
    name: Install Over Stale Dependencies (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download built wheel
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Pre-install old, incompatible versions of our dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "typer==0.9.0" "rich==13.7.0" "pydantic==2.5.3" \
            "prompt-toolkit==3.0.36" "httpx==0.26.0" "numpy==1.26.4"

      - name: Install the wheel on top
        shell: bash
        run: python -m pip install dist/*.whl packaging

      - name: Stale versions were upgraded and Velune starts
        shell: bash
        run: |
          python - <<'EOF'
          from importlib.metadata import version
          from packaging.version import Version
          floors = {"typer": "0.16.0", "rich": "13.9.0", "pydantic": "2.11.0",
                    "prompt-toolkit": "3.0.48", "httpx": "0.27.0"}
          for dist, floor in floors.items():
              got = version(dist)
              assert Version(got) >= Version(floor), f"{dist} {got} < {floor}"
              print(f"ok {dist} {got} >= {floor}")
          EOF
          velune --version
          for cmd in doctor config provider models; do velune "$cmd" --help > /dev/null; done
          velune doctor check || true

  # The one-line installers (scripts/install.sh / install.ps1) on clean
  # runners, pointed at the freshly built wheel instead of PyPI.
  installer:
    name: One-line Installer (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      PYTHONIOENCODING: utf-8
      VELUNE_NO_MODIFY_PATH: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Download built wheel
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Lint install.sh
        if: runner.os == 'Linux'
        run: shellcheck scripts/install.sh

      - name: Run install.sh
        if: runner.os != 'Windows'
        run: VELUNE_PACKAGE="$(ls "$PWD"/dist/*.whl)" sh scripts/install.sh

      - name: Run install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:VELUNE_PACKAGE = (Get-ChildItem dist\*.whl).FullName
          Get-Content -Raw scripts\install.ps1 | Invoke-Expression

  ci-pass:
    name: CI Pass
    runs-on: ubuntu-latest
    needs: [lint, security, test, build, install-smoke, install-lowest, install-polluted, installer]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.security.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.install-smoke.result }}" != "success" ] || \
             [ "${{ needs.install-lowest.result }}" != "success" ] || \
             [ "${{ needs.install-polluted.result }}" != "success" ] || \
             [ "${{ needs.installer.result }}" != "success" ]; then
            echo "❌ One or more jobs failed"
            exit 1
          fi
          echo "✓ All CI checks passed"
          exit 0
