<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 870" role="img" aria-labelledby="t d">
<title id="t">A team picked for the task</title>
<desc id="d">The four built-in council skills and their stages. Coding: explorer, then implementer and tester together, then reviewer. Planning: analyst, architect, critic, planner. Review: mapper, then correctness and security together, then lead. Research: researcher, then writer. Six permission profiles decide what a team may do.</desc>
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2f6bff"/><stop offset="0.55" stop-color="#8b7bff"/><stop offset="1" stop-color="#7fd8ff"/></linearGradient>
<radialGradient id="glow" cx="0.5" cy="0" r="0.9"><stop offset="0" stop-color="#8b7bff" stop-opacity="0.22"/><stop offset="1" stop-color="#8b7bff" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1280" height="870" fill="#0b0d12"/>
<rect width="1280" height="870" fill="url(#glow)"/>
