font-family="ui-monospace, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="600" fill="#7fd8ff" text-anchor="middle" >answer-only</text></g><text x="40" y="620" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#9aa4c0" text-anchor="start" >PERMISSION PROFILES  (a separate file decides what the team may do)</text><g data-profile="answer-only" data-write="none" data-commands="none"><rect x="40" y="634" width="388" height="80" rx="14" fill="#1b2133" stroke="#2a3248" stroke-width="1" /><text x="62" y="667" font-family="ui-monospace, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="17" font-weight="700" fill="#eef2ff" text-anchor="start" >answer-only</text><text x="62" y="692" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#c9d1e3" text-anchor="start" >No files, commands or network</text></g><g data-profile="read-only" data-write="none" data-commands="none"><rect x="446" y="634" width="388" height="80" rx="14" fill="#1b2133" stroke="#2a3248" stroke-width="1" /><text x="468" y="667" font-family="ui-monospace, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="17" font-weight="700" fill="#eef2ff" text-anchor="start" >read-only</text><text x="468" y="692" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#c9d1e3" text-anchor="start" >Reads and searches; changes nothing</text></g><g data-profile="propose-changes" data-write="proposal" data-commands="none"><rect x="852" y="634" width="388" height="80" rx="14" fill="#1b2133" stroke="#2a3248" stroke-width="1" /><text x="874" y="667" font-family="ui-monospace, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="17" font-weight="700" fill="#eef2ff" text-anchor="start" >propose-changes</text><text x="874" y="692" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#c9d1e3" text-anchor="start" >Proposes edits for you to approve</text></g><g data-profile="edit-workspace" data-write="workspace" data-commands="none"><rect x="40" y="726" width="388" height="80" rx="14" fill="#1b2133" stroke="#2a3248" stroke-width="1" /><text x="62" y="759" font-family="ui-monospace, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="17" font-weight="700" fill="#eef2ff" text-anchor="start" >edit-workspace</text><text x="62" y="784" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#c9d1e3" text-anchor="start" >Edits files through the permission gate</text></g><g data-profile="build-project" data-write="workspace" data-commands="allowlist"><rect x="446" y="726" width="388" height="80" rx="14" fill="#1b2133" stroke="#2a3248" stroke-width="1" /><text x="468" y="759" font-family="ui-monospace, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="17" font-weight="700" fill="#eef2ff" text-anchor="start" >build-project</text><text x="468" y="784" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#c9d1e3" text-anchor="start" >Edits files and runs allowed commands</text></g><g data-profile="integrations" data-write="none" data-commands="none"><rect x="852" y="726" width="388" height="80" rx="14" fill="#1b2133" stroke="#2a3248" stroke-width="1" /><text x="874" y="759" font-family="ui-monospace, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="17" font-weight="700" fill="#eef2ff" text-anchor="start" >integrations</text><text x="874" y="784" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#c9d1e3" text-anchor="start" >MCP servers and connected integrations</text></g><text x="640" y="846" font-family="ui-monospace, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#9aa4c0" text-anchor="middle" >Source: velune/swarm/skills/  ·  velune/swarm/permissions/  ·  /skills show &lt;name&gt;</text>
