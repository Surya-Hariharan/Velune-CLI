<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-labelledby="t d">
<title id="t">Velune CLI</title>
<desc id="d">A faceted three-dimensional V symbol with five agent nodes (Planner, Coder, Reviewer, Challenger, Synthesizer) converging on it.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0c11"/><stop offset="1" stop-color="#17132a"/></linearGradient>
  <radialGradient id="glow" cx="50%" cy="48%" r="45%"><stop offset="0" stop-color="#7c5cff" stop-opacity=".38"/><stop offset=".55" stop-color="#2f6bff" stop-opacity=".10"/><stop offset="1" stop-color="#2f6bff" stop-opacity="0"/></radialGradient>
  <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9ff0ff"/><stop offset="1" stop-color="#5a8bff"/></linearGradient>
  <linearGradient id="left" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6d5cff"/><stop offset="1" stop-color="#2b1f7a"/></linearGradient>
  <linearGradient id="right" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a7bff"/><stop offset="1" stop-color="#1a2a86"/></linearGradient>
  <linearGradient id="flowg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7fd8ff" stop-opacity=".25"/><stop offset="1" stop-color="#b39bff" stop-opacity=".95"/></linearGradient>
  <linearGradient id="word" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9ff0ff"/><stop offset=".55" stop-color="#8aa2ff"/><stop offset="1" stop-color="#b79cff"/></linearGradient>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#8b9bd6" stroke-opacity=".07"/></pattern>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<style>
  .role{font:600 19px Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif;fill:#aeb8d8;letter-spacing:.04em}
  .flow{fill:none;stroke-width:2;stroke-dasharray:4 9;animation:flow 2.4s linear infinite}
  .node{transform-box:fill-box;transform-origin:center;animation:pulse 3.2s ease-in-out infinite}
  .gem{animation:float 6s ease-in-out infinite}
  .shadow{transform-box:fill-box;transform-origin:center;animation:shadow 6s ease-in-out infinite}
  .spin{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-26}}
  @keyframes pulse{0%,100%{opacity:.75}50%{opacity:1}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  @keyframes shadow{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(.88);opacity:.35}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){.flow,.node,.gem,.shadow,.spin{animation:none}}
</style>
<rect width="1200" height="460" rx="18" fill="url(#bg)"/>
<rect width="1200" height="460" rx="18" fill="url(#grid)"/>
<ellipse cx="600" cy="215" rx="520" ry="210" fill="url(#glow)"/>
<g class="spin"><ellipse cx="600" cy="215" rx="330" ry="120" fill="none" stroke="#9aa8ff" stroke-opacity=".14" stroke-dasharray="2 10"/></g>
<path class="flow" d="M190,150 Q355,222 520,215" stroke="url(#flowg)"/><path class="flow" d="M255,322 Q388,228 520,215" stroke="url(#flowg)"/><path class="flow" d="M1010,150 Q845,222 680,215" stroke="url(#flowg)"/><path class="flow" d="M945,322 Q812,228 680,215" stroke="url(#flowg)"/><path class="flow" d="M600,40 Q600,74 600,108" stroke="url(#flowg)"/>
<ellipse class="shadow" cx="600" cy="372" rx="130" ry="16" fill="#6a55ff" filter="url(#blur)"/>
<g class="gem">
  <polygon points="600,95 704,155 600,215 496,155" fill="url(#top)"/>
  <polygon points="496,155 600,215 600,335 496,275" fill="url(#left)"/>
  <polygon points="704,155 600,215 600,335 704,275" fill="url(#right)"/>
  <path d="M600,95 L704,155 L704,275 L600,335 L496,275 L496,155 Z" fill="none" stroke="#fff" stroke-opacity=".28" stroke-linejoin="round"/>
  <path d="M496,155 L600,215 L704,155 M600,215 L600,335" fill="none" stroke="#fff" stroke-opacity=".22"/>
  <polyline points="532,176 600,296 668,176" fill="none" stroke="#eaffff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)" opacity=".55"/>
  <polyline points="532,176 600,296 668,176" fill="none" stroke="#f4fdff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="600,95 650,124 600,153 550,124" fill="#fff" opacity=".16"/>
</g>
<g class="node" style="animation-delay:0.0s"><circle cx="190" cy="150" r="16" fill="#8b7bff" opacity=".14"/><circle cx="190" cy="150" r="7" fill="#0b0d12" stroke="#7fd8ff" stroke-width="2"/></g><g class="node" style="animation-delay:0.7s"><circle cx="255" cy="322" r="16" fill="#8b7bff" opacity=".14"/><circle cx="255" cy="322" r="7" fill="#0b0d12" stroke="#7fd8ff" stroke-width="2"/></g><g class="node" style="animation-delay:1.4s"><circle cx="1010" cy="150" r="16" fill="#8b7bff" opacity=".14"/><circle cx="1010" cy="150" r="7" fill="#0b0d12" stroke="#7fd8ff" stroke-width="2"/></g><g class="node" style="animation-delay:2.0999999999999996s"><circle cx="945" cy="322" r="16" fill="#8b7bff" opacity=".14"/><circle cx="945" cy="322" r="7" fill="#0b0d12" stroke="#7fd8ff" stroke-width="2"/></g><g class="node" style="animation-delay:2.8s"><circle cx="600" cy="40" r="16" fill="#8b7bff" opacity=".14"/><circle cx="600" cy="40" r="7" fill="#0b0d12" stroke="#7fd8ff" stroke-width="2"/></g>
<text x="164" y="157" text-anchor="end" class="role">Planner</text><text x="229" y="329" text-anchor="end" class="role">Coder</text><text x="1036" y="157" text-anchor="start" class="role">Reviewer</text><text x="971" y="329" text-anchor="start" class="role">Challenger</text><text x="600" y="18" text-anchor="middle" class="role">Synthesizer</text>
<text x="600" y="432" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="700" font-size="38" fill="url(#word)" textLength="330" lengthAdjust="spacing">VELUNE CLI</text>
</svg>
