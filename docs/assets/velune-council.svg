<title id="t">The council scales with the task</title>
<desc id="d">A matrix of council seats by depth tier. Instant uses the Coder only; minimal adds the Planner; standard adds Reviewer and Synthesizer; full uses all nine seats: five core roles and four specialist critics.</desc>
