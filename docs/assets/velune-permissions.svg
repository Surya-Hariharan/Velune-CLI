" >?</text><text x="992" y="213" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#ffb454" text-anchor="start" >asked</text></g><rect x="40" y="258" width="1120" height="78" rx="14" fill="#151926" stroke="#2a3248" stroke-width="1" /><text x="66" y="294" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#eef2ff" text-anchor="start" >Plan</text><text x="66" y="318" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9aa4c0" text-anchor="start" >plan files only</text><g data-mode="Plan" data-col="reads" data-state="allowed"><rect x="295" y="277" width="164" height="40" rx="20" fill="#1b2133" stroke="#7fd8ff" stroke-width="1.5" /><g transform="translate(325 297)"><path d="M-7 0 l5 6 l9 -11" fill="none" stroke="#7fd8ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="347" y="303" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#7fd8ff" text-anchor="start" >allowed</text></g><g data-mode="Plan" data-col="ordinary" data-state="refused"><rect x="510" y="277" width="164" height="40" rx="20" fill="#1b2133" stroke="#ff6b81" stroke-width="1.5" /><g transform="translate(540 297)"><path d="M-6 -6 l12 12 M6 -6 l-12 12" fill="none" stroke="#ff6b81" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="562" y="303" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#ff6b81" text-anchor="start" >refused</text></g><g data-mode="Plan" data-col="high_risk" data-state="refused"><rect x="725" y="277" width="164" height="40" rx="20" fill="#1b2133" stroke="#ff6b81" stroke-width="1.5" /><g transform="translate(755 297)"><path d="M-6 -6 l12 12 M6 -6 l-12 12" fill="none" stroke="#ff6b81" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="777" y="303" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#ff6b81" text-anchor="start" >refused</text></g><g data-mode="Plan" data-col="outside" data-state="refused"><rect x="940" y="277" width="164" height="40" rx="20" fill="#1b2133" stroke="#ff6b81" stroke-width="1.5" /><g transform="translate(970 297)"><path d="M-6 -6 l12 12 M6 -6 l-12 12" fill="none" stroke="#ff6b81" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="992" y="303" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#ff6b81" text-anchor="start" >refused</text></g><rect x="40" y="348" width="1120" height="78" rx="14" fill="#151926" stroke="#2a3248" stroke-width="1" /><text x="66" y="384" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#eef2ff" text-anchor="start" >Auto</text><text x="66" y="408" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9aa4c0" text-anchor="start" >unattended</text><g data-mode="Auto" data-col="reads" data-state="allowed"><rect x="295" y="367" width="164" height="40" rx="20" fill="#1b2133" stroke="#7fd8ff" stroke-width="1.5" /><g transform="translate(325 387)"><path d="M-7 0 l5 6 l9 -11" fill="none" stroke="#7fd8ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="347" y="393" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#7fd8ff" text-anchor="start" >allowed</text></g><g data-mode="Auto" data-col="ordinary" data-state="allowed"><rect x="510" y="367" width="164" height="40" rx="20" fill="#1b2133" stroke="#7fd8ff" stroke-width="1.5" /><g transform="translate(540 387)"><path d="M-7 0 l5 6 l9 -11" fill="none" stroke="#7fd8ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="562" y="393" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#7fd8ff" text-anchor="start" >allowed</text></g><g data-mode="Auto" data-col="high_risk" data-state="asked"><rect x="725" y="367" width="164" height="40" rx="20" fill="#1b2133" stroke="#ffb454" stroke-width="1.5" /><circle cx="755" cy="387" r="9" fill="none" stroke="#ffb454" stroke-width="2.5"/><text x="755" y="392" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#ffb454" text-anchor="middle" >?</text><text x="777" y="393" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#ffb454" text-anchor="start" >asked</text></g><g data-mode="Auto" data-col="outside" data-state="refused"><rect x="940" y="367" width="164" height="40" rx="20" fill="#1b2133" stroke="#ff6b81" stroke-width="1.5" /><g transform="translate(970 387)"><path d="M-6 -6 l12 12 M6 -6 l-12 12" fill="none" stroke="#ff6b81" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="992" y="393" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#ff6b81" text-anchor="start" >refused</text></g><rect x="40" y="446" width="360" height="150" rx="14" fill="#1b2133" stroke="#2a3248" stroke-width="1" /><text x="62" y="478" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#eef2ff" text-anchor="start" >Undo what it did</text><text x="62" y="506" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#c9d1e3" text-anchor="start" >/diff shows what changed on disk.</text><text x="62" y="527" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#c9d1e3" text-anchor="start" >/rewind undoes the file changes of the</text><text x="62" y="548" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#c9d1e3" text-anchor="start" >agent's last turn. /undo reverts its</text><text x="62" y="569" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#c9d1e3" text-anchor="start" >last commit.</text><rect x="420" y="446" width="360" height="150" rx="14" fill="#1b2133" stroke="#2a3248" stroke-width="1" /><text x="442" y="478" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#eef2ff" text-anchor="start" >High-risk means high-risk</text><text x="442" y="506" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#c9d1e3" text-anchor="start" >Recursive deletes, secret files (.env, keys,</text><text x="442" y="527" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#c9d1e3" text-anchor="start" >~/.ssh) and protected paths (.git/,</text><text x="442" y="548" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#c9d1e3" text-anchor="start" >.velune/hooks.json, velune.toml). Never</text><text x="442" y="569" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#c9d1e3" text-anchor="start" >covered by a session-wide always-allow.</text><rect x="800" y="446" width="360" height="150" rx="14" fill="#1b2133" stroke="#2a3248" stroke-width="1" /><text x="822" y="478" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#eef2ff" text-anchor="start" >Honest limits</text><text x="822" y="506" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#c9d1e3" text-anchor="start" >Commands run through a managed runner:</text><text x="822" y="527" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#c9d1e3" text-anchor="start" >process management, not OS isolation.</text><text x="822" y="548" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#c9d1e3" text-anchor="start" >For isolation, enable the optional Docker</text><text x="822" y="569" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#c9d1e3" text-anchor="start" >sandbox (execution.docker_sandbox = true).</text><text x="600" y="650" font-family="ui-monospace, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#9aa4c0" text-anchor="middle" >Source: docs/filesystem-tools.md (Safety model)  ·  docs/usage-guide.md, section 3  ·  Plan mode writes only .velune/plans/&lt;name&gt;.md</text>
</svg>
