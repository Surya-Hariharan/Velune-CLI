<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 664" role="img" aria-labelledby="t d">
<title id="t">You decide how much it may do</title>
<desc id="d">A matrix of Manual, Plan and Auto execution modes against reads, ordinary changes, high-risk changes and changes outside the workspace. Manual is the default.</desc>
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2f6bff"/><stop offset="0.55" stop-color="#8b7bff"/><stop offset="1" stop-color="#7fd8ff"/></linearGradient>
<linearGradient id="gv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fd8ff"/><stop offset="1" stop-color="#2f6bff"/></linearGradient>
<radialGradient id="glow" cx="0.5" cy="0" r="0.9"><stop offset="0" stop-color="#8b7bff" stop-opacity="0.22"/><stop offset="1" stop-color="#8b7bff" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="664" fill="#0b0d12"/>
<rect width="1200" height="664" fill="url(#glow)"/>
