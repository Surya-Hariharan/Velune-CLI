<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 728 784" width="728" height="784" role="img" aria-labelledby="t d">
<title id="t">Velune CLI terminal output</title>
<desc id="d">Real output of the commands velune --version and velune --help, captured from Velune CLI 0.9.9 and shortened after the Setup and Models group.</desc>
