nimation:k20 24.0s steps(1,end) infinite}@keyframes k20{0%,26.50%{opacity:0}26.51%,95%{opacity:1}100%{opacity:0}}.l21{animation:k21 24.0s steps(1,end) infinite}@keyframes k21{0%,27.17%{opacity:0}27.18%,95%{opacity:1}100%{opacity:0}}.l22{animation:k22 24.0s steps(1,end) infinite}@keyframes k22{0%,27.83%{opacity:0}27.84%,95%{opacity:1}100%{opacity:0}}.l24{animation:k24 24.0s steps(1,end) infinite}@keyframes k24{0%,29.17%{opacity:0}29.18%,95%{opacity:1}100%{opacity:0}}.l25{animation:k25 24.0s steps(1,end) infinite}@keyframes k25{0%,29.83%{opacity:0}29.84%,95%{opacity:1}100%{opacity:0}}.l26{animation:k26 24.0s steps(1,end) infinite}@keyframes k26{0%,30.50%{opacity:0}30.51%,95%{opacity:1}100%{opacity:0}}.l28{animation:k28 24.0s steps(1,end) infinite}@keyframes k28{0%,31.83%{opacity:0}31.84%,95%{opacity:1}100%{opacity:0}}.l29{animation:k29 24.0s steps(1,end) infinite}@keyframes k29{0%,32.50%{opacity:0}32.51%,95%{opacity:1}100%{opacity:0}}.l30{animation:k30 24.0s steps(1,end) infinite}@keyframes k30{0%,33.17%{opacity:0}33.18%,95%{opacity:1}100%{opacity:0}}.l31{animation:k31 24.0s steps(1,end) infinite}@keyframes k31{0%,33.83%{opacity:0}33.84%,95%{opacity:1}100%{opacity:0}}.l32{animation:k32 24.0s steps(1,end) infinite}@keyframes k32{0%,34.50%{opacity:0}34.51%,95%{opacity:1}100%{opacity:0}}.l33{animation:k33 24.0s steps(1,end) infinite}@keyframes k33{0%,35.17%{opacity:0}35.18%,95%{opacity:1}100%{opacity:0}}.l34{animation:k34 24.0s steps(1,end) infinite}@keyframes k34{0%,35.83%{opacity:0}35.84%,95%{opacity:1}100%{opacity:0}}
