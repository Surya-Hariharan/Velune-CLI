<rect width="728" height="784" rx="12" fill="#0d0f14"/>
<rect x=".5" y=".5" width="727" height="783" rx="12" fill="none" stroke="#2a3042"/>
<rect x="0" y="0" width="728" height="36" rx="12" fill="#151926"/><rect x="0" y="24" width="728" height="12" fill="#151926"/>
<circle cx="22" cy="18" r="5.5" fill="#ff6b6b"/><circle cx="42" cy="18" r="5.5" fill="#ffd166"/><circle cx="62" cy="18" r="5.5" fill="#5ad1a4"/>
<text x="364.0" y="23" text-anchor="middle" style="font-size:12px" fill="#6b7389">velune</text>
<text class="l0" x="28" y="62" xml:space="preserve" textLength="151.2" lengthAdjust="spacing"><tspan fill="#5ad1e6">$ </tspan><tspan fill="#eef2ff">velune --version</tspan></text><text class="l1" x="28" y="82" xml:space="preserve" textLength="109.2" lengthAdjust="spacing"><tspan fill="#c9d1e3">velune v0.9.9</tspan></text><text class="l3" x="28" y="122" xml:space="preserve" textLength="126.0" lengthAdjust="spacing"><tspan fill="#5ad1e6">$ </tspan><tspan fill="#eef2ff">velune --help</tspan></text><text class="l4" x="28" y="142" xml:space="preserve" textLength="663.6" lengthAdjust="spacing"><tspan fill="#8f82ff">┌─────────────────────────────────────────────────────────────────────────────┐</tspan></text><text class="l5" x="28" y="162" xml:space="preserve" textLength="663.6" lengthAdjust="spacing"><tspan fill="#8f82ff">│  velune v0.9.9                                                              │</tspan></text><text class="l6" x="28" y="182" xml:space="preserve" textLength="663.6" lengthAdjust="spacing"><tspan fill="#8f82ff">│  Terminal-first cognitive AI orchestration system                           │</tspan></text><text class="l7" x="28" y="202" xml:space="preserve" textLength="663.6" lengthAdjust="spacing"><tspan fill="#8f82ff">│                                                                             │</tspan></text><text class="l8" x="28" y="222" xml:space="preserve" textLength="663.6" lengthAdjust="spacing"><tspan fill="#8f82ff">│  Run velune with no arguments to start the interactive session.             │</tspan></text><text class="l9" x="28" y="242" xml:space="preserve" textLength="663.6" lengthAdjust="spacing"><tspan fill="#8f82ff">└─────────────────────────────────────────────────────────────────────────────┘</tspan></text><text class="l11" x="28" y="282" xml:space="preserve" textLength="344.4" lengthAdjust="spacing"><tspan fill="#9aa4c0">Usage: velune [OPTIONS] COMMAND [ARGS]...</tspan></text><text class="l12" x="28" y="302" xml:space="preserve" textLength="596.4" lengthAdjust="spacing"><tspan fill="#9aa4c0">Options: --workspace/-w  --config/-c  --mode manual|plan|auto  --yes/-y</tspan></text><text class="l13" x="28" y="322" xml:space="preserve" textLength="285.6" lengthAdjust="spacing"><tspan fill="#9aa4c0">--verbose/-v  --version  --help/-h</tspan></text><text class="l15" x="28" y="362" xml:space="preserve" textLength="33.6" lengthAdjust="spacing"><tspan fill="#b39bff" font-weight="700">Core</tspan></text><text class="l16" x="28" y="382" xml:space="preserve" textLength="361.2" lengthAdjust="spacing"><tspan fill="#6ea8ff">chat     </tspan><tspan fill="#c9d1e3">Start an interactive chat session.</tspan></text><text class="l17" x="28" y="402" xml:space="preserve" textLength="369.6" lengthAdjust="spacing"><tspan fill="#6ea8ff">run      </tspan><tspan fill="#c9d1e3">Run an autonomous, multi-step task.</tspan></text><text class="l18" x="28" y="422" xml:space="preserve" textLength="327.6" lengthAdjust="spacing"><tspan fill="#6ea8ff">ask      </tspan><tspan fill="#c9d1e3">Ask a single one-off question.</tspan></text><text class="l19" x="28" y="442" xml:space="preserve" textLength="638.4" lengthAdjust="spacing"><tspan fill="#6ea8ff">native   </tspan><tspan fill="#c9d1e3">Run a task on the opt-in native engine (read-only, approval-gated).</tspan></text><text class="l20" x="28" y="462" xml:space="preserve" textLength="613.2" lengthAdjust="spacing"><tspan fill="#6ea8ff">init     </tspan><tspan fill="#c9d1e3">Set up Velune in a project — config, environment, and repository</tspan></text><text class="l21" x="28" y="482" xml:space="preserve" textLength="126.0" lengthAdjust="spacing"><tspan fill="#c9d1e3">         index.</tspan></text><text class="l22" x="28" y="502" xml:space="preserve" textLength="588.0" lengthAdjust="spacing"><tspan fill="#6ea8ff">onboard  </tspan><tspan fill="#c9d1e3">Run the first-time setup wizard, or resume an incomplete run.</tspan></text><text class="l24" x="28" y="542" xml:space="preserve" textLength="168.0" lengthAdjust="spacing"><tspan fill="#b39bff" font-weight="700">Workspace &amp; Sessions</tspan></text><text class="l25" x="28" y="562" xml:space="preserve" textLength="352.8" lengthAdjust="spacing"><tspan fill="#6ea8ff">project  </tspan><tspan fill="#c9d1e3">Open, index, and switch projects.</tspan></text><text class="l26" x="28" y="582" xml:space="preserve" textLength="394.8" lengthAdjust="spacing"><tspan fill="#6ea8ff">session  </tspan><tspan fill="#c9d1e3">List, resume, or delete chat sessions.</tspan></text><text class="l28" x="28" y="622" xml:space="preserve" textLength="117.6" lengthAdjust="spacing"><tspan fill="#b39bff" font-weight="700">Setup &amp; Models</tspan></text><text class="l29" x="28" y="642" xml:space="preserve" textLength="462.0" lengthAdjust="spacing"><tspan fill="#6ea8ff">setup     </tspan><tspan fill="#c9d1e3">Configure providers and models interactively.</tspan></text><text class="l30" x="28" y="662" xml:space="preserve" textLength="529.2" lengthAdjust="spacing"><tspan fill="#6ea8ff">models    </tspan><tspan fill="#c9d1e3">Discover, pull, switch, assign, and remove AI models.</tspan></text><text class="l31" x="28" y="682" xml:space="preserve" textLength="621.6" lengthAdjust="spacing"><tspan fill="#6ea8ff">provider  </tspan><tspan fill="#c9d1e3">Manage AI providers — add, remove, test, list, and check status.</tspan></text><text class="l32" x="28" y="702" xml:space="preserve" textLength="386.4" lengthAdjust="spacing"><tspan fill="#6ea8ff">config    </tspan><tspan fill="#c9d1e3">Read and write velune.toml settings.</tspan></text><text class="l33" x="28" y="722" xml:space="preserve" textLength="462.0" lengthAdjust="spacing"><tspan fill="#6ea8ff">trust     </tspan><tspan fill="#c9d1e3">Trust, list, or revoke workspace directories.</tspan></text><text class="l34" x="28" y="742" xml:space="preserve" textLength="25.2" lengthAdjust="spacing"><tspan fill="#6b7389">...</tspan></text>
</svg>
